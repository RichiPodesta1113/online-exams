name: Generate Documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/generate-documentation.yml"
  workflow_dispatch:

jobs:
  documentation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate documentation
        run: |
          test -f docs/data-dictionary.md
          test -f docs/er-diagram.md
          test -f docs/class-diagram.md
          test -f docs/component-diagram.md
          test -f docs/deployment-diagram.md

      - name: Create documentation package
        run: |
          mkdir generated-documentation
          cp docs/*.md generated-documentation/

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: online-exams-documentation
          path: generated-documentation/