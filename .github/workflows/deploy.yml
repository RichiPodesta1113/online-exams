name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build API image
        run: |
          docker build \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/online-exams-api:${{ github.sha }} \
            ./backend

      - name: Push API image
        run: |
          docker push \
            ${{ secrets.ACR_LOGIN_SERVER }}/online-exams-api:${{ github.sha }}

      - name: Deploy API
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --name online-exams-api \
              --resource-group online-exams-rg \
              --image ${{ secrets.ACR_LOGIN_SERVER }}/online-exams-api:${{ github.sha }}