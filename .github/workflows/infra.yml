name: Infrastructure
on: workflow_dispatch
jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infrastructure } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
      - run: terraform init
      - run: terraform validate
      - run: terraform plan
