name: Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore backend
        run: dotnet restore backend/src/OnlineExams.Api/OnlineExams.Api.csproj

      - name: Semgrep
        uses: semgrep/semgrep-action@v1

      - name: Build Docker image
        run: docker build -t online-exams-api ./backend

      - name: Snyk dependencies
        uses: snyk/actions/dotnet@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=backend/src/OnlineExams.Api/OnlineExams.Api.csproj

      - name: Snyk container
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: online-exams-api

      - name: Save Snyk report
        if: always()
        run: |
          echo "# Security Scan" > security-report.md
          echo "" >> security-report.md
          echo "Security workflow executed with Semgrep and Snyk." >> security-report.md
          echo "Review the GitHub Actions execution for detailed findings." >> security-report.md

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.md